<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section class="form-section">
      <!-- form per aggiungere un libro: titolo, autore, anno, formato (cartaceo/digitale) -->
      <h2>Aggiungi un libro</h2>
      <form id="aggiungi-form" class="form">
        <div class="campo">
          <label for="title" class="form-label fw-semibold">Titolo</label>
          <input type="text" class="form-control" id="title" required>

          <label for="author" class="form-label fw-semibold">Autore</label>
          <input type="text" class="form-control" id="author" required>

          <label for="year" class="form-label fw-semibold">Anno</label>
          <input type="number" class="form-control" id="year" required>

          <label for="format" class="form-label fw-semibold">Formato</label>
          <select class="form-select" id="tipoProgetto" required>
            <option value="" disabled selected>Scegli un'opzione</option>
            <option value="paper">Cartaceo</option>
            <option value="digital">Digitale</option>
             </select>
            <div class="campo campo-condizionale" id="campo-dimensione" hidden>
              <label for="dimension" class="form-label fw-semibold">Dimensione MB</label>
              <input type="number" class="form-control" id="dimension" required>
            </div>
         <button type="submit" class="btn-primary">Aggiungi</button>
        </div>
      </form>
    </section>

    <section class="lista-section">
      <h2>I tuoi libri</h2>
      <ul id="lista-libri">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
