<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light">

  <header class="site-header text-center py-5">
    <h1 class="fw-bold">La mia libreria</h1>
    <p class="text-muted">Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container mb-5">

    <!-- Sezione Form -->
    <section class="card shadow-sm border-0 mb-5">
      <div class="card-body p-4">
        <h2 class="fw-bold mb-4 fs-4">Aggiungi un libro</h2>
        
        <form id="aggiungi-form">
          <!-- Campo Titolo -->
          <div class="mb-3">
            <label for="title" class="form-label fw-bold small">Titolo</label>
            <input type="text" class="form-control" id="title" required>
          </div>

          <!-- Campo Autore -->
          <div class="mb-3">
            <label for="author" class="form-label fw-bold small">Autore</label>
            <input type="text" class="form-control" id="author" required>
          </div>

          <!-- Campo Anno -->
          <div class="mb-3">
            <label for="year" class="form-label fw-bold small">Anno</label>
            <input type="number" class="form-control" id="year" required>
          </div>

          <!-- Campo Formato -->
          <div class="mb-3">
            <label for="format" class="form-label fw-bold small">Formato</label>
            <select class="form-select" id="format" required>
              <option value="" disabled selected>Seleziona un'opzione</option>
              <option value="paper">Cartaceo</option>
              <option value="digital">Digitale</option>
            </select>
          </div>

          <!-- Campo condizionale (nascosto di default) -->
          <div class="mb-3 d-none" id="campo-dimensione">
            <label for="dimension" class="form-label fw-bold small">Dimensione MB</label>
            <input type="number" class="form-control" id="dimension">
          </div>

          <!-- Bottone -->
          <button type="submit" class="btn btn-custom-blue mt-2">Aggiungi</button>
        </form>
      </div>
    </section>

    <!-- Sezione Lista -->
    <section class="lista-section">
      <h2 class="fw-bold fs-4 mb-3">I tuoi libri (<span id="contatore-libri">0</span>)</h2>
      <ul id="lista-libri" class="list-unstyled">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
